name: pull-twelvedata
on: workflow_dispatch
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python td_pull.py
        env:
          TD_KEYS: ${{ secrets.TD_KEYS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: td-csv
          path: out/*.csv
