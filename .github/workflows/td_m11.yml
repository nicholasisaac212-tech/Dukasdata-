name: pull-twelvedata-m1
on: workflow_dispatch
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python td_pull_m1.py
        env:
          TD_KEYS: ${{ secrets.TD_KEYS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: td-m1-csv
          path: out/*.csv
