name: pull-dukascopy
on: workflow_dispatch
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: ONESHOT=1 WAIT_MINUTES=20 node fetch.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duka-csv
          path: out/*.csv
